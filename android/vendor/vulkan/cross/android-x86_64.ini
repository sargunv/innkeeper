# Meson cross file for Android x86_64 (NDK clang). Needs a preceding cross file
# that defines the constants ndk_bin and api (build.sh generates it). sccache
# wraps the compilers (tools/build/sccache.sh).
[binaries]
ar = ndk_bin / 'llvm-ar'
c = ['sccache', ndk_bin / 'x86_64-linux-android' + api + '-clang']
cpp = ['sccache', ndk_bin / 'x86_64-linux-android' + api + '-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
c_ld = 'lld'
cpp_ld = 'lld'
strip = ndk_bin / 'llvm-strip'
objcopy = ndk_bin / 'llvm-objcopy'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-Wl,--build-id=sha1', '-Wl,-z,max-page-size=16384']
cpp_link_args = ['-Wl,--build-id=sha1', '-Wl,-z,max-page-size=16384']

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
