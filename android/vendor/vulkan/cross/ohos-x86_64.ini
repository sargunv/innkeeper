# Meson cross file for OpenHarmony x86_64: NDK clang on the build container's
# musl, with the static compiler-rt and libc++ that build.sh builds. Needs a
# preceding cross file that defines the constants ndk_bin, sysroot and
# resource (build.sh generates it). sccache wraps the compilers
# (tools/build/sccache.sh).
[constants]
musl = ['--target=x86_64-linux-musl', '--sysroot=' + sysroot, '-resource-dir=' + resource,
  '--start-no-unused-arguments', '-rtlib=compiler-rt', '-unwindlib=none', '--end-no-unused-arguments']

[binaries]
ar = ndk_bin / 'llvm-ar'
c = ['sccache', ndk_bin / 'clang'] + musl
cpp = ['sccache', ndk_bin / 'clang++'] + musl + ['-fno-exceptions', '-fno-unwind-tables',
  '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-stdlib=libc++', '-static-libstdc++',
  '--end-no-unused-arguments']
c_ld = 'lld'
cpp_ld = 'lld'
strip = ndk_bin / 'llvm-strip'
objcopy = ndk_bin / 'llvm-objcopy'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-Wl,--build-id=sha1']
cpp_link_args = ['-Wl,--build-id=sha1']

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
