org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
# Keep Gradle's optional HTML problems report out of the source tree.
org.gradle.problems.report=false
kotlin.code.style=official
# Gradle and Kotlin write only under out/. build.gradle.kts sets the build dirs.
org.gradle.projectcachedir=../../out/build/system-app/gradle
# mise.toml passes kotlin.project.persistent.dir as an absolute path because a
# relative one resolves against the shared daemon's directory, which may be
# another worktree.
