org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
# Keep Gradle's optional HTML problems report out of the source tree.
org.gradle.problems.report=false
kotlin.code.style=official
# Gradle and Kotlin write only under out/ (build dirs: build.gradle.kts).
org.gradle.projectcachedir=../../out/build/system-app/gradle
# kotlin.project.persistent.dir is passed absolute by mise.toml: a relative one
# resolves against the shared daemon's directory, which may be another worktree.
