[package]
name = "linuxapk-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux.apk desktop bridge: host-side services (audio first) for the Android session"

[dependencies]
anyhow = "1"
pulseaudio = "0.3.2"
rustix = { version = "1.1", features = [
  "event",
  "fs",
  "mm",
  "net",
  "process",
  "time",
] }

calloop = "0.14"
sctk = { package = "smithay-client-toolkit", version = "0.21", default-features = false, features = [
  "calloop",
] }
sctk-adwaita = "0.12"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = [
  "client",
  "staging",
  "unstable",
] }

[dev-dependencies]
proptest = "1.12"
