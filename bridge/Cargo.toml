[package]
name = "linuxapk-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux.apk desktop bridge: host-side services (audio first) for the Android session"

[dependencies]
anyhow = "1"
pulseaudio = "0.3.2"
rustix = { version = "1.1", features = [
  "event",
  "fs",
  "mm",
  "net",
  "pipe",
  "process",
  "rand",
  "time",
] }

calloop = "0.14"
linuxapk-core = { path = "../core" }
sctk = { package = "smithay-client-toolkit", version = "0.21", default-features = false, features = [
  "calloop",
] }
sctk-adwaita = "0.12"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = [
  "client",
  "staging",
  "unstable",
] }

# Desktop integration (services/): D-Bus (portals, notifications, MPRIS),
# the Wayland clipboard (ext-data-control), PNG for MPRIS artwork.
png = "0.18"
signal-hook = { version = "0.3", default-features = false, features = [
  "iterator",
] }
zbus = { version = "5", default-features = false, features = [
  "blocking-api",
  "async-io",
] }

[dev-dependencies]
proptest = "1.12"
