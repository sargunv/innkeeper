[package]
name = "innkeeper-manager"
version = "0.1.0"
edition = "2024"
publish = false
description = "Innkeeper manager: install, run and remove Android apps (GTK 4 and libadwaita)"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_48"] }
innkeeper-core = { path = "../core" }
