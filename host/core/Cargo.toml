[package]
name = "innkeeper-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Innkeeper host library: install, run and manage Android apps and the session; APK metadata, icons and desktop entries"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
base64 = "0.23.1"
innkeeper-session = { path = "../launcher" }
# The DynamicLauncher portal (dynlauncher.rs), as the bridge uses zbus.
zbus = { version = "5", default-features = false, features = [
  "blocking-api",
  "async-io",
] }
zip = { version = "9.1.2", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }
# Adaptive/vector icons are rendered locally; no Android session or SDK.
resvg = { version = "0.49", default-features = false, features = [
  "raster-images",
] }
