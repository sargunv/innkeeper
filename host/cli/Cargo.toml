[package]
name = "innkeeper"
version = "0.1.0"
edition = "2024"
publish = false
description = "Innkeeper host command: install Android apps with desktop entries, run them, manage the session"

[dependencies]
serde_json = "1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
innkeeper-core = { path = "../core" }
rustix = { version = "1.1", features = ["fs"] }
# The launch splash (src/splash.rs).
png = "0.18"
sctk = { package = "smithay-client-toolkit", version = "0.21", default-features = false, features = [
  "calloop",
] }
