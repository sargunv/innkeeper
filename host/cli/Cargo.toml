[package]
name = "linuxapk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux.apk host command: install Android apps with desktop entries, run them, manage the session"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
linuxapk-core = { path = "../core" }
linuxapk-bridge = { path = "../bridge" }
# The launch splash (src/splash.rs).
png = "0.18"
sctk = { package = "smithay-client-toolkit", version = "0.21", default-features = false, features = [
  "calloop",
] }
