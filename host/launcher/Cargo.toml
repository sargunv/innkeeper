[package]
name = "innkeeper-session"
version = "0.1.0"
edition = "2024"
publish = false
description = "Innkeeper session launcher: boots the Android image inside the Flatpak sandbox"

[[bin]]
name = "innkeeper-session"
path = "src/main.rs"

[dependencies]
innkeeper-profile = { path = "../profile" }
anyhow = "1.0.104"
flate2 = "1.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"
