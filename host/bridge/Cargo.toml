[package]
name = "linuxapk-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux.apk desktop bridge: host-side services (audio, windows, desktop integration) for the Android session"

[dependencies]
anyhow = "1"
libc = "0.2"
linuxapk-broker = { path = "../../supervisor/broker" }
pulseaudio = "0.3.2"
rustix = { version = "1.1", features = [
  "event",
  "fs",
  "mm",
  "net",
  "pipe",
  "process",
  "rand",
  "time",
] }

calloop = "0.14"
linuxapk-core = { path = "../core" }
sctk = { package = "smithay-client-toolkit", version = "0.21", default-features = false, features = [
  "calloop",
] }
sctk-adwaita = { path = "third_party/sctk-adwaita" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = [
  "client",
  "staging",
  "unstable",
] }
# The host keyboard layout and compose (input/xkb.rs), loaded at run time.
xkbcommon-dl = "0.4"

# Desktop integration (system/, documents/): D-Bus (portals, notifications, MPRIS),
# the Wayland clipboard (ext-data-control), PNG for MPRIS artwork.
png = "0.18"
url = "2"
mime_guess = "2"
signal-hook = { version = "0.3", default-features = false, features = [
  "iterator",
] }
zbus = { version = "5", default-features = false, features = [
  "blocking-api",
  "async-io",
] }

# Accessibility (a11y/): AccessKit trees on AT-SPI, over zbus like the rest.
accesskit = "0.25"
accesskit_unix = "0.24"

[dev-dependencies]
# Checks that every update the a11y service builds is one AccessKit accepts.
accesskit_consumer = "0.39"
