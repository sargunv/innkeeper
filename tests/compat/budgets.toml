# What a compat run allows the session to cost; docs/compatibility.md says how
# each is measured. A run fails when a measurement is over its budget by more
# than its margin (0.25: 25%). Times vary with host load, memory much less.
# Lower a budget when a change makes the session cheaper; raise one only with
# the reason in the commit message.

# Cold session start, ms.
session_start_ms = { budget = 2500, margin = 0.25 }
# Warm app start: the corpus median, ms.
app_start_ms = { budget = 200, margin = 0.25 }
# Idle session memory without page cache, MiB.
# Minimal HOME: 527 -> 484 MiB after 90 s idle; keep 13 MiB of the 43 MiB saving.
idle_memory_mib = { budget = 545, margin = 0.10 }
