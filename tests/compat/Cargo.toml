[package]
name = "innkeeper-compat"
version = "0.1.0"
edition = "2024"
publish = false
description = "Innkeeper compat harness: install, launch and smoke-test the F-Droid corpus in a live session"

[dependencies]
anyhow = "1"
innkeeper-core = { path = "../../host/core" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
