[settings]
experimental = true
pin = true
lockfile = true

[tools]
"aqua:dprint/dprint" = "0.64.3"
"aqua:jdx/jactionlint" = "2.3.0"
"aqua:Kitware/CMake" = "4.4.4"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:ninja-build/ninja" = "1.13.2"
"core:rust" = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy", targets = "x86_64-unknown-linux-musl" }
"github:jdx/hk" = "2.8.1"
"core:java" = "zulu-25.36.205.0"
"core:node" = "24.22.2"
sccache = "0.19.0"

[env]
_.file = "tools/build/toolchain.env"
ANDROID_HOME = "{{ env.ANDROID_HOME | default(value=env.HOME ~ '/Android/Sdk') }}"
ANDROID_NDK_HOME = "{{ env.ANDROID_HOME }}/ndk/{{ env.ANDROID_NDK_VERSION }}"
# Every checkout on the machine shares one compiler cache
# (tools/build/sccache.sh). The server has its own port so that another
# project's sccache server, which has other settings and another cache, can't
# answer our requests.
SCCACHE_DIR = "{{ env.XDG_CACHE_HOME | default(value=env.HOME ~ '/.cache') }}/innkeeper/sccache"
SCCACHE_SERVER_PORT = "4227"
# In a new worktree, dependency crates (glib, gtk, ...) come from the cache.
# sccache passes incremental compilations through, so dev builds of workspace
# crates stay incremental. CI sets RUSTC_WRAPPER to an empty value
# (tools/ci/setup.sh).
RUSTC_WRAPPER = "{{ env.RUSTC_WRAPPER | default(value='sccache') }}"
# The OpenHarmony SDK parts that ohos/sdk.sh fetches, shared by every checkout.
OHOS_SDK_HOME = "{{ env.XDG_CACHE_HOME | default(value=env.HOME ~ '/.cache') }}/innkeeper/ohos-sdk"

# ---- build -------------------------------------------------------------------
# Each build:<module> task fills out/build/<module>/install/ with a tree of
# paths relative to the stage prefix, and `build` merges the trees into
# out/stage. Both systems use the host, broker, image-tools and vulkan modules.
# Android adds ndk, system-app and data, and OpenHarmony adds ohos and
# ohos-system-app. The probe apps for the tests go to out/test/probes and
# aren't staged.

[tasks.build]
description = "Build every module and stage them into out/stage"
depends = ["build:*"]
run = "tools/build/stage.sh"

[tasks."build:host"]
description = "innkeeper, innkeeper-manager, innkeeper-bridge, innkeeper-session, the manager's desktop data"
run = "tools/build/host.sh"

[tasks."build:broker"]
description = "innkeeper-brk, static musl: the supervisor of both guests"
run = """
set -euo pipefail
cargo build -q --release --target x86_64-unknown-linux-musl -p innkeeper-broker --bin innkeeper-brk
i=out/build/broker/install
rm -rf "$i"
install -D -m 755 -s --strip-program="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
  out/cargo/x86_64-unknown-linux-musl/release/innkeeper-brk "$i/libexec/innkeeper/innkeeper-brk"
"""

[tasks."build:ndk"]
description = "Android's C/C++ (the NDK superbuild: shim, HALs, exec relay) and the firewall front ends"
run = """
set -euo pipefail
tools/build/sccache.sh cmake --preset android >/dev/null
tools/build/sccache.sh cmake --build --preset android
i=out/build/ndk/install
rm -rf "$i"
cmake --install out/build/android --strip --prefix "$i" >/dev/null
"""

[tasks."build:vulkan"]
description = "Mesa RADV, ANV and lavapipe for Android, and RADV and ANV for OpenHarmony (build container; skipped when its inputs are unchanged)"
run = "android/vendor/vulkan/build.sh"

[tasks."build:system-app"]
description = "InnkeeperSystem.apk, platform-signed; InnkeeperProbes.apk for the tests (out/test/probes)"
dir = "android/system-app"
run = "./gradlew --console=plain -q -Pkotlin.project.persistent.dir={{config_root}}/out/build/system-app/kotlin :app:install :probes:install"

[tasks."build:image-tools"]
description = "Static simg2img, lpunpack, fsck.erofs and debugfs for image setup (build container; skipped when unchanged)"
run = "image/tools/build.sh"

[tasks."build:data"]
description = "The overlay (android/overlay) and the image's config and scripts"
run = """
set -euo pipefail
rm -rf out/build/overlay/install out/build/image/install
mkdir -p out/build/overlay/install/share/innkeeper/android
cp -a android/overlay/. out/build/overlay/install/share/innkeeper/android/
i=out/build/image/install
install -D -m 644 -t $i/share/innkeeper/image image/bootconfig image/vendor.prop image/fork-bases.sha256
install -D -m 644 -t $i/share/innkeeper/android android/pin.toml
install -D -m 755 -t $i/libexec/innkeeper/image image/*.sh
"""

[tasks."build:ohos"]
description = "OpenHarmony's layer: its shim, display VDIs and init cfgs"
run = "ohos/build.sh"

[tasks."build:ohos-system-app"]
description = "Innkeeper System for OpenHarmony, a preinstalled system app, built with the pinned OpenHarmony SDK"
depends = ["build:ohos"]
run = "ohos/system-app/build.sh"

[tasks."build:ohos-probe"]
description = "InnkeeperProbes.hap for the OpenHarmony tests (out/test/probes), built with the pinned OpenHarmony SDK"
run = "ohos/probe/build.sh"

[tasks.package]
description = "Build the stage and the Flatpak bundle in out/release/ (-- [stable] [--install])"
depends = ["build"]
run = "packaging/flatpak/build.sh"

[tasks.clean]
description = "Remove build output (out/build, out/stage, out/cargo, the test probes in out/test/probes); keeps test results"
run = "rm -rf out/build out/stage out/cargo out/test/probes"

# ---- test --------------------------------------------------------------------

[tasks.test]
description = "Unit behaviour: Rust, Kotlin protocol/input, HALs, supervisor, image scripts and Innkeeper System for OpenHarmony"
run = """
set -euo pipefail
cargo test -q --workspace
(cd android/system-app && ./gradlew --console=plain -q -Pkotlin.project.persistent.dir={{config_root}}/out/build/system-app/kotlin :protocol:test)
tools/build/sccache.sh cmake --preset host-tests >/dev/null
tools/build/sccache.sh cmake --build --preset host-tests
ctest --preset host-tests
for t in image/tests/*.sh; do echo "== $t"; "$t"; done
python3 -B -m unittest discover -s tools/ci/tests
python3 -B -m unittest discover -s tests/e2e -p 'test_*.py'
node --test ohos/system-app/tests/*.test.mjs
"""

[tasks."test:bionic"]
description = "Android test binaries against our HALs in a fresh named session"
run = """
set -euo pipefail
v=out/build/android/android/vendor/graphics/test-vendor
tests/bionic/run.sh -v "$v" -- /vendor/bin/gralloc_test
tests/bionic/run.sh -v "$v" -- /vendor/bin/gpu_copy_test
tests/bionic/run.sh -v "$v" -- /vendor/bin/hwc_test
android/vendor/vulkan/tests/run.sh
"""

[tasks."test:e2e"]
description = "Observable app behaviour on an isolated desktop (-- [boot input audio desktop lifecycle] | ohos); whole run <60 s"
run = "tests/e2e/run.sh"

[tasks."test:compat"]
description = "Manual app troubleshooting (-- --only PKG), never a gate"
env = { INNKEEPER_PROFILE = "{{ env.INNKEEPER_PROFILE | default(value='compat') }}" }
run = "tests/compat/run.sh"

[tasks.bench]
description = "Manual input and frame latency measurements (-- input|frame); never a test gate"
run = "tests/bench/run.sh"

# ---- run ---------------------------------------------------------------------

[tasks.session]
description = "The staged session launcher (mise run session -- start|stop|status|...)"
run = "tools/dev/session.sh"

# ---- lint --------------------------------------------------------------------

[tasks.check]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"

[hooks]
postinstall = ["hk install --mise"]
