[package]
name = "ubinder"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux.apk ubinder: a userspace reimplementation of the Android binder driver, serviced through the session's seccomp user-notification supervisor"

[lib]
crate-type = ["rlib"]

[dependencies]
libc = "0.2"

# The broker helper: the dynamic bionic binary pivot-exec forks to serve the
# binder seccomp listener (ubinder/src/bin/broker.rs). Installed into the
# session overlay as /system/bin/linuxapk-ubinder by session/build.sh.
[[bin]]
name = "linuxapk-ubinder"
path = "src/bin/broker.rs"

# Dependency-free fuzzer for the command-stream parser.
[[bin]]
name = "ubinder-fuzz"
path = "src/bin/fuzz.rs"

