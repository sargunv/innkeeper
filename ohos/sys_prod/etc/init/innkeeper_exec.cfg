{
    "jobs" : [{
            "name" : "post-fs-data",
            "cmds" : [
                "start innkeeper_execd"
            ]
        }
    ],
    "services" : [{
            "name" : "innkeeper_execd",
            "path" : ["/sys_prod/bin/innkeeper-exec", "--serve"],
            "uid" : "root",
            "gid" : ["root", "shell", "system"],
            "apl" : "normal",
            "permission" : [
                "ohos.permission.DUMP"
            ],
            "start-mode" : "condition",
            "secon" : "u:r:sh:s0"
        }
    ]
}
