{
    "jobs" : [{
            "name" : "param:bootevent.samgr.ready=true",
            "condition" : "bootevent.samgr.ready=true",
            "cmds" : [
                "start linuxapk_probe"
            ]
        }
    ],
    "services" : [{
            "name" : "linuxapk_probe",
            "path" : ["/system/bin/sh", "-c", "test -f /data/linuxapk/probe.sh && /system/bin/sh /data/linuxapk/probe.sh >/data/linuxapk/probe.out 2>&1; echo $? >/data/linuxapk/probe.done"],
            "uid" : "root",
            "gid" : ["root", "shell", "system"],
            "once" : 1,
            "apl" : "normal",
            "permission" : [
                "ohos.permission.DUMP"
            ],
            "start-mode" : "condition",
            "secon" : "u:r:sh:s0"
        }
    ]
}
