name: Linux.apk runner
description:
  Toolchains, build caches and runtime prerequisites for hosted Linux runners
inputs:
  runtime:
    description: Install Android and runtime prerequisites (false for lint)
    default: "true"
runs:
  using: composite
  steps:
    - name: Runner packages and kernel setup
      shell: bash
      run: tools/ci/setup.sh
      env:
        LINUXAPK_CI_RUNTIME: ${{ inputs.runtime }}
    - uses: jdx/mise-action@v5
      with:
        cache: true
    - uses: actions/cache@v4
      if: inputs.runtime == 'true'
      id: sdk
      with:
        path: ~/Android/Sdk
        key: sdk-${{ runner.os }}-${{ hashFiles('tools/build/toolchain.env') }}
    - name: Android SDK
      if: inputs.runtime == 'true'
      shell: bash
      run: |
        source tools/build/toolchain.env
        if [[ '${{ steps.sdk.outputs.cache-hit }}' != true ]]; then
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$ANDROID_NDK_VERSION" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;android-$ANDROID_COMPILE_SDK.0"
        fi
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          out/cargo
          out/build/host-tests
        key:
          compile-${{ runner.os }}-${{ hashFiles('mise.lock', 'Cargo.lock',
          '**/*.gradle.kts', '**/gradle-wrapper.properties',
          'tools/build/toolchain.env') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          compile-${{ runner.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', '**/*.gradle.kts', '**/gradle-wrapper.properties', 'tools/build/toolchain.env') }}-${{ github.job }}-
    - uses: actions/cache@v4
      if: inputs.runtime == 'true'
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          out/build/system-app
        key:
          gradle-${{ runner.os }}-${{ hashFiles('android/system-app/**',
          'tools/build/toolchain.env', 'mise.lock') }}-${{ github.job }}
        restore-keys: |
          gradle-${{ runner.os }}-
    - uses: actions/cache@v4
      if: inputs.runtime == 'true'
      with:
        path: out/ci/images
        key:
          image-${{ hashFiles('image/pin.toml', 'image/*.sh',
          'image/bootconfig') }}
    - uses: actions/cache@v4
      if: inputs.runtime == 'true'
      with:
        path: out/test/compat/corpus
        key: corpus-${{ hashFiles('tests/compat/corpus.toml') }}
