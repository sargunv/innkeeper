name: Linux.apk runner
description:
  Toolchains, build caches and runtime prerequisites for hosted Linux runners
outputs:
  android-key:
    description: Cache key of the Mesa/LLVM and image-tools build
    value: ${{ steps.android.outputs.cache-primary-key }}
  android-hit:
    description: Whether that build was restored
    value: ${{ steps.android.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Runner packages and kernel setup
      shell: bash
      run: tools/ci/setup.sh
    - uses: jdx/mise-action@v5
      with:
        cache: true
    - uses: actions/cache@v4
      with:
        path: ~/Android/Sdk
        key: sdk-${{ runner.os }}-${{ hashFiles('tools/build/toolchain.env') }}
    - name: Android SDK
      shell: bash
      run: |
        source tools/build/toolchain.env
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;$ANDROID_NDK_VERSION" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;android-$ANDROID_COMPILE_SDK.0"
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >>"$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          out/cargo
          ~/.gradle/caches
          ~/.gradle/wrapper
        key:
          compile-${{ runner.os }}-${{ hashFiles('mise.lock', 'Cargo.lock',
          '**/*.gradle.kts', '**/gradle-wrapper.properties') }}-${{ github.sha
          }}
        restore-keys: |
          compile-${{ runner.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}-
    # Restore only: the workflow saves right after `mise run build`, so a cold
    # Mesa/LLVM build is kept even if a later step fails.
    - uses: actions/cache/restore@v4
      id: android
      with:
        path: |
          out/build/vulkan/install
          out/build/vulkan/.stamp
          out/build/vulkan/deps/llvm
          out/build/image-tools/install
          out/build/image-tools/.stamp
        key:
          android-${{ runner.os }}-${{ hashFiles('android/vendor/vulkan/**',
          'android/vendor/graphics/common/**', 'image/tools/**',
          'tools/container/Containerfile', 'tools/build/toolchain.env') }}
    - uses: actions/cache@v4
      with:
        path: out/ci/images
        key:
          image-${{ hashFiles('image/pin.toml', 'image/*.sh',
          'image/bootconfig') }}
    - uses: actions/cache@v4
      with:
        path: out/test/compat/corpus
        key: corpus-${{ hashFiles('tests/compat/corpus.toml') }}
