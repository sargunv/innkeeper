name: Release stage
description:
  Restore the stage and probes saved for this tree's build inputs, or build and
  save them
inputs:
  restore-only:
    description: Fail on a cache miss instead of building
    default: "false"
runs:
  using: composite
  steps:
    - name: Stage input tree
      id: inputs
      shell: bash
      run: |
        # The digest covers the paths, symlinks, modes and contents of every
        # build input. An exact hit restores the stage and probes, and the job
        # skips setup and build.
        digest=$(git ls-tree -r HEAD -- host supervisor/shim \
          supervisor/broker android ohos guest image tools/build tools/container \
          packaging/flatpak Cargo.toml Cargo.lock \
          .cargo CMakeLists.txt CMakePresets.json mise.toml mise.lock \
          .github/workflows/ci.yml .github/actions tools/ci/setup.sh | sha256sum)
        echo "stage=${digest%% *}" >>"$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: stage
      with:
        path: |
          out/stage
          out/test/probes
        key:
          stage-v3-${{ runner.os }}-${{ runner.arch }}-${{
          steps.inputs.outputs.stage }}
        fail-on-cache-miss: ${{ inputs.restore-only }}
    - uses: ./.github/actions/setup
      if: steps.stage.outputs.cache-hit != 'true'
      with:
        mode: build
    - uses: ./.github/actions/build-cached
      if: steps.stage.outputs.cache-hit != 'true'
    - uses: actions/cache@v4
      if: steps.stage.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/innkeeper-dev/keys
        key:
          platform-key-${{ hashFiles('android/system-app/build.gradle.kts') }}
    # The OpenHarmony SDK builds the HAPs. ohos/sdk.sh fetches it on a miss,
    # ohos/system-app/sdk.sh adds the system app's declarations and headers,
    # and the cache is saved before the build so that a failed build keeps
    # it.
    - uses: actions/cache/restore@v4
      if: steps.stage.outputs.cache-hit != 'true'
      id: ohos-sdk
      with:
        path: ~/.cache/innkeeper/ohos-sdk
        key:
          ohos-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('ohos/sdk.env', 'ohos/sdk.sh', 'ohos/system-app/sdk.env',
          'ohos/system-app/sdk.sh') }}
    - name: OpenHarmony SDK
      if:
        steps.ohos-sdk.outcome == 'success' && steps.ohos-sdk.outputs.cache-hit
        != 'true'
      shell: bash
      run: mise exec -- ohos/system-app/sdk.sh
    - uses: actions/cache/save@v4
      if:
        steps.ohos-sdk.outcome == 'success' && steps.ohos-sdk.outputs.cache-hit
        != 'true'
      with:
        path: ~/.cache/innkeeper/ohos-sdk
        key: ${{ steps.ohos-sdk.outputs.cache-primary-key }}
    - if: steps.stage.outputs.cache-hit != 'true'
      shell: bash
      run: mise run build
    - uses: actions/cache/save@v4
      if: steps.stage.outputs.cache-hit != 'true'
      with:
        path: |
          out/stage
          out/test/probes
        key: ${{ steps.stage.outputs.cache-primary-key }}
