name: Release

on:
  # Runs after CI succeeds on a push to main. Packaging the stage that CI
  # built avoids a second full build and keeps commits that failed CI out of
  # the snapshot. GitHub runs the version of this file on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the Flatpak bundle without publishing it
        type: boolean
        default: true

# contents: write lets the jobs create the GitHub Release and move the
# snapshot tag.
permissions:
  contents: write

concurrency:
  group:
    ${{ github.event_name == 'workflow_run' && 'snapshot' ||
    format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  build:
    # A snapshot reuses the stage that CI saved. Tags and manual runs have no
    # CI run to reuse, so they build the stage here.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/stage

  package:
    needs: build
    # The build job is skipped for snapshots. A snapshot is published only
    # after a successful CI run that a push triggered.
    if: |
      !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          # For workflow_run, github.sha is main's current tip, which can be
          # newer than the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/stage
        with:
          restore-only: true
      - uses: ./.github/actions/setup
        with:
          mode: runtime
      - name: Build the bundle
        run: |
          packaging/flatpak/build.sh '${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && 'stable' || 'snapshot' }}'
      - name: Publish the snapshot bundle
        if:
          github.event_name == 'workflow_run' || (github.event_name ==
          'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          !inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=$(echo out/release/*-snapshot.flatpak)
          name=${bundle##*/}
          built=$(date -u +%Y-%m-%dT%H:%MZ)
          notes="Snapshot of $(git rev-parse HEAD), built ${built}."
          notes="${notes}"$'\n\n```sh\n'"flatpak install --user ./${name}"$'\n```\n\n'
          notes="${notes}A newer snapshot is a reinstall of the new file."
          # The snapshot is a single floating release. Move its tag onto this
          # commit, upload the bundle, and delete any other asset, such as a
          # bundle left behind by a renamed app id.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/tags/snapshot"
          if gh release view snapshot >/dev/null 2>&1; then
            gh release edit snapshot --prerelease --title snapshot --notes "$notes"
          else
            gh release create snapshot --prerelease --title snapshot --notes "$notes"
          fi
          gh release upload snapshot "$bundle" --clobber
          # --clobber replaces only an asset with the same name.
          gh release view snapshot --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              [[ -n $asset && $asset != "$name" ]] || continue
              gh release delete-asset snapshot "$asset" --yes
            done
      - name: Publish the stable bundle
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=$(echo out/release/*-stable.flatpak)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "$bundle" --clobber
