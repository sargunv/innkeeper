name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the Flatpak bundle without publishing it
        type: boolean
        default: true

# contents: write creates the GitHub Release and moves the snapshot tag.
permissions:
  contents: write

concurrency:
  group:
    ${{ github.ref == 'refs/heads/main' && 'snapshot' || format('release-{0}',
    github.ref) }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  CARGO_BUILD_JOBS: 4
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  LINUXAPK_IMAGES: ${{ github.workspace }}/out/ci/images

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    outputs:
      stage: ${{ steps.inputs.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage input tree
        id: inputs
        shell: bash
        run: |
          # Same digest as CI's build job, so a push reuses that job's stage.
          digest=$(git ls-tree -r HEAD -- host supervisor/pivot-exec supervisor/shim \
            supervisor/broker android image tools/build tools/container \
            packaging/flatpak Cargo.toml Cargo.lock \
            .cargo CMakeLists.txt CMakePresets.json mise.toml mise.lock \
            .github/workflows/ci.yml .github/actions tools/ci/setup.sh | sha256sum)
          echo "stage=${digest%% *}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: stage
        with:
          path: |
            out/stage
            out/test/probes
          key:
            stage-v3-${{ runner.os }}-${{ runner.arch }}-${{
            steps.inputs.outputs.stage }}
      - uses: ./.github/actions/setup
        if: steps.stage.outputs.cache-hit != 'true'
        with:
          mode: build
      - uses: ./.github/actions/build-cached
        if: steps.stage.outputs.cache-hit != 'true'
      - uses: actions/cache@v4
        if: steps.stage.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/linuxapk-dev/keys
          key:
            platform-key-${{ hashFiles('android/system-app/build.gradle.kts') }}
      - run: mise run build
        if: steps.stage.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.stage.outputs.cache-hit != 'true'
        with:
          path: |
            out/stage
            out/test/probes
          key: ${{ steps.stage.outputs.cache-primary-key }}

  package:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: |
            out/stage
            out/test/probes
          key:
            stage-v3-${{ runner.os }}-${{ runner.arch }}-${{
            needs.build.outputs.stage }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/setup
        with:
          mode: nightly
      - name: Build the bundle
        env:
          LINUXAPK_RELEASE_VERSION:
            ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          packaging/flatpak/release.sh '${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && 'stable' || 'snapshot' }}'
      - name: Publish the snapshot bundle
        if:
          github.ref == 'refs/heads/main' && (github.event_name !=
          'workflow_dispatch' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=$(echo out/release/*-snapshot.flatpak)
          name=${bundle##*/}
          built=$(date -u +%Y-%m-%dT%H:%MZ)
          notes="Snapshot of ${GITHUB_SHA}, built ${built}."
          notes="${notes}"$'\n\n```sh\n'"flatpak install --user ./${name}"$'\n```\n\n'
          notes="${notes}A newer snapshot is a reinstall of the new file."
          # One floating release. Move the tag onto this commit, then replace
          # the asset, so snapshot builds do not pile up.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/tags/snapshot"
          if gh release view snapshot >/dev/null 2>&1; then
            gh release edit snapshot --prerelease --title snapshot --notes "$notes"
          else
            gh release create snapshot --prerelease --title snapshot --notes "$notes"
          fi
          gh release upload snapshot "$bundle" --clobber
      - name: Publish the stable bundle
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=$(echo out/release/*-stable.flatpak)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "$bundle" --clobber
