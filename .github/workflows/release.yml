name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds the bundle and keeps it as a workflow artifact, so the
  # release path can be tried without a tag.
  workflow_dispatch:

# contents: write lets the package job create the draft release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    # The tagged commit has usually passed CI on main, which saved its stage,
    # so this job restores it. Otherwise it builds the stage.
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/stage

  package:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          # build.sh counts commits for an untagged build's version.
          fetch-depth: 0
      - uses: ./.github/actions/stage
        with:
          restore-only: true
      - uses: ./.github/actions/setup
        with:
          mode: runtime
      - name: Build the bundle
        run: packaging/flatpak/build.sh
      - name: Keep the bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: out/release/*.flatpak
          if-no-files-found: error
          retention-days: 7
      - name: Attach the bundle to a draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The maintainer writes the notes and publishes the draft. A tag
          # with a suffix, such as v2026.12.0-rc.1, is a prerelease. A rerun
          # replaces the bundle on the existing release.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --title "$GITHUB_REF_NAME" --notes "")
            [[ $GITHUB_REF_NAME != *-* ]] || flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" out/release/*.flatpak --clobber
