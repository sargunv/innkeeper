name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_BUILD_JOBS: 4
  # Debug symbols and per-checkout incremental state only inflate CI caches.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  INNKEEPER_IMAGES: ${{ github.workspace }}/out/ci/images
  FLATPAK_USER_DIR: ${{ github.workspace }}/out/flatpak/user
  INNKEEPER_PROFILE: ci
  # The 16 GB runner runs one capped (8 GiB) Android session at a time.
  INNKEEPER_MIN_AVAILABLE_GIB: 10

jobs:
  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tools/ci/changed-paths.sh "$BASE" "$GITHUB_SHA"

  lint:
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          mode: ${{ needs.changes.outputs.code == 'true' && 'lint' || 'docs' }}
      - run: mise run check
        if: needs.changes.outputs.code == 'true'
      - name: Documentation checks
        if: needs.changes.outputs.code != 'true'
        run: mise exec -- hk check --all --skip-step cargo-clippy

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120 # Cold Mesa/LLVM builds; warm runs reuse the saved build.
    steps:
      - uses: actions/checkout@v5
      - name: Stage input tree
        id: inputs
        shell: bash
        run: |
          # Include paths, symlinks and executable modes as well as contents.
          digest=$(git ls-tree -r HEAD -- host supervisor/pivot-exec supervisor/shim \
            supervisor/broker android image tools/build tools/container \
            packaging/flatpak Cargo.toml Cargo.lock \
            .cargo CMakeLists.txt CMakePresets.json mise.toml mise.lock \
            .github/workflows/ci.yml .github/actions tools/ci/setup.sh | sha256sum)
          echo "stage=${digest%% *}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: stage
        with:
          path: |
            out/stage
            out/test/probes
          key:
            stage-v3-${{ runner.os }}-${{ runner.arch }}-${{
            steps.inputs.outputs.stage }}
      - uses: ./.github/actions/setup
        if: steps.stage.outputs.cache-hit != 'true'
        with:
          mode: build
      - uses: ./.github/actions/build-cached
        if: steps.stage.outputs.cache-hit != 'true'
      - uses: actions/cache@v4
        if: steps.stage.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/innkeeper-dev/keys
          key:
            platform-key-${{ hashFiles('android/system-app/build.gradle.kts') }}
      - run: mise run build
        if: steps.stage.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.stage.outputs.cache-hit != 'true'
        with:
          path: |
            out/stage
            out/test/probes
          key: ${{ steps.stage.outputs.cache-primary-key }}
      - name: Archive the release stage and test probes
        run: |
          tar -C out/stage -czf out/stage.tar.gz .
          tar -C out/test/probes -czf out/probes.tar.gz .
      - name: Release stage and manifest
        uses: actions/upload-artifact@v4
        with:
          name: stage
          overwrite: true
          path: |
            out/stage.tar.gz
            out/probes.tar.gz
            out/stage/share/innkeeper/manifest.tsv
          if-no-files-found: error
          retention-days: 7

  unit:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          mode: unit
      - uses: ./.github/actions/restore-stage
      - run: mise run test

  e2e:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          mode: e2e
      - uses: ./.github/actions/restore-stage
      - name: Runtime input tree
        id: runtime
        run: |
          image=$(git ls-tree -r HEAD -- image/pin.toml image/*.sh image/bootconfig \
            image/tools tools/container/Containerfile tools/container/run.sh \
            host/launcher/src/image.rs | sha256sum)
          flatpak=$(git ls-tree -r HEAD -- packaging/flatpak/dev-init.sh \
            packaging/flatpak/dev.sargunv.Innkeeper.yml tools/dev/run.py | sha256sum)
          echo "image=${image%% *}" >>"$GITHUB_OUTPUT"
          echo "flatpak=${flatpak%% *}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: image
        with:
          path: out/ci/images
          key:
            image-v2-${{ runner.os }}-${{ runner.arch }}-${{
            steps.runtime.outputs.image }}
      - uses: actions/cache/restore@v4
        id: flatpak
        with:
          path: out/flatpak/user
          key:
            flatpak-v1-${{ runner.os }}-${{ runner.arch }}-${{
            steps.runtime.outputs.flatpak }}
      - name: Prepare the image and private Flatpak for the timed run
        run: |
          # Flatpak must see a host directory before sharing it.
          mkdir -p "$INNKEEPER_IMAGES"
          # actions/cache drops xattrs. Recreate the tiny CLAT ownership layer;
          # extracted partitions and flattened APEXes remain cached.
          find "$INNKEEPER_IMAGES" -path '*/derived/single.source' -delete
          mise run session -- prepare
          img=$(out/stage/libexec/innkeeper/innkeeper-session image | sed -n 's/^img=//p')
          test -f "$img/system/system/build.prop"
      # Save before e2e, whose failures must not discard expensive preparation.
      - uses: actions/cache/save@v4
        if: steps.image.outputs.cache-hit != 'true'
        with:
          path: out/ci/images
          key: ${{ steps.image.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: steps.flatpak.outputs.cache-hit != 'true'
        with:
          path: out/flatpak/user
          key: ${{ steps.flatpak.outputs.cache-primary-key }}
      - name: End-to-end tests on an isolated software desktop
        run: mise run test:e2e
        env:
          INNKEEPER_E2E_DEADLINE: 180
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-logs
          overwrite: true
          path: |
            out/test/e2e/ci/
            out/test/nested/**/*.log
            out/test/nested/**/*.txt
            out/dev/flatpak/ci/*.log
            !out/test/nested/**/data/**
            !**/android-data*/**
          retention-days: 7

  # Preserve a single required gate: skipped jobs must not hide a failed dependency.
  checks:
    needs: [changes, lint, build, unit, e2e]
    if:
      always() && (github.event_name == 'push' || github.event_name ==
      'pull_request')
    runs-on: ubuntu-26.04
    steps:
      - name: Require all applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          required = ['changes', 'lint']
          if jobs['changes']['outputs'].get('code') == 'true':
              required += ['build', 'unit', 'e2e']
          assert all(jobs[j]['result'] == 'success' for j in required), jobs
          PYCODE

  nightly:
    if:
      github.event_name == 'schedule' || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-cached
      - uses: actions/cache@v4
        with:
          path: ~/.cache/innkeeper-dev/keys
          key:
            platform-key-${{ hashFiles('android/system-app/build.gradle.kts') }}
      - name: Build the stage and Flatpak
        run: mise run package:flatpak
      - name: Stage manifest
        uses: actions/upload-artifact@v4
        with:
          name: stage-manifest
          path: out/stage/share/innkeeper/manifest.tsv
      - name: Full headless compatibility corpus
        id: headless
        run: tools/ci/compat.sh headless
      - name: Full windowed compatibility corpus
        if: ${{ !cancelled() && steps.headless.outcome != 'skipped' }}
        run: tools/ci/compat.sh windowed
      - name: Render compatibility wiki page
        id: wiki
        if: ${{ !cancelled() && steps.headless.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          python3 tools/ci/compat-wiki.py --reports out/ci/reports \
            --output out/ci/reports/Compatibility.md
      - name: Publish compatibility to the wiki
        if: ${{ !cancelled() && steps.wiki.outcome == 'success' }}
        continue-on-error: true # Publishing must never mask the corpus result.
        env:
          GH_TOKEN: ${{ secrets.INNKEEPER_WIKI_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::notice::Wiki publishing skipped: INNKEEPER_WIKI_TOKEN is not set. Compatibility results remain in the artifact.'
            exit 0
          fi
          if ! git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            clone https://github.com/sargunv/innkeeper.wiki.git out/ci/wiki; then
            echo '::warning::Wiki clone failed; check INNKEEPER_WIKI_TOKEN and wiki initialization. See tests/README.md.'
            exit 1
          fi
          cp out/ci/reports/Compatibility.md out/ci/wiki/Compatibility.md
          cd out/ci/wiki
          git add Compatibility.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update nightly compatibility results'
          if ! git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD; then
            echo '::warning::Wiki push failed; compatibility results remain in the artifact. See tools/ci/README.md for the required credential.'
            exit 1
          fi
      - name: Compatibility reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility
          path: |
            out/ci/reports
            out/test/nested/**/*.log
            out/test/nested/**/*.txt
            out/dev/flatpak/**/*.log
            !out/test/nested/**/data/**
            !**/android-data*/**
          retention-days: 14
