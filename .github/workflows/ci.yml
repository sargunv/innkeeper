name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_BUILD_JOBS: 4
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  LINUXAPK_IMAGES: ${{ github.workspace }}/out/ci/images
  FLATPAK_USER_DIR: ${{ github.workspace }}/out/flatpak/user
  LINUXAPK_INSTANCE: ci
  # The 16 GB runner runs one capped (8 GiB) Android session at a time.
  LINUXAPK_MIN_AVAILABLE_GIB: 10

jobs:
  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          runtime: "false"
      - run: mise run check

  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 120 # Cold Mesa/LLVM builds; warm runs reuse the saved build.
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Stage input tree
        id: inputs
        shell: bash
        run: |
          # Include paths, symlinks and executable modes as well as contents.
          digest=$(git ls-tree -r HEAD -- host supervisor android image tools/build \
            tools/container packaging/flatpak tests/bionic Cargo.toml Cargo.lock \
            .cargo CMakeLists.txt CMakePresets.json mise.toml mise.lock | sha256sum)
          echo "stage=${digest%% *}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: stage
        with:
          path: |
            out/stage
            out/test/probes
          key:
            stage-v2-${{ runner.os }}-${{ runner.arch }}-${{
            steps.inputs.outputs.stage }}
      - uses: ./.github/actions/build-cached
        if: steps.stage.outputs.cache-hit != 'true'
      - run: mise run build
        if: steps.stage.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.stage.outputs.cache-hit != 'true'
        with:
          path: |
            out/stage
            out/test/probes
          key: ${{ steps.stage.outputs.cache-primary-key }}
      - name: Archive the release stage
        run: tar -C out/stage -czf out/stage.tar.gz .
      - name: Release stage and manifest
        uses: actions/upload-artifact@v4
        with:
          name: stage
          path: |
            out/stage.tar.gz
            out/stage/share/linuxapk/manifest.tsv
          if-no-files-found: error
          retention-days: 7
      - run: mise run test
      - name: Prepare the image and private Flatpak for the timed run
        run: mise run session -- prepare
      - name: End-to-end tests on an isolated software desktop
        run: mise run test:e2e
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-logs
          path: |
            out/test
            out/dev/flatpak/**/*.log
            !out/test/compat/corpus/**
            !**/android-data*/**
          retention-days: 7

  nightly:
    if:
      github.event_name == 'schedule' || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-cached
      - name: Build the stage and Flatpak
        run: mise run package:flatpak
      - name: Stage manifest
        uses: actions/upload-artifact@v4
        with:
          name: stage-manifest
          path: out/stage/share/linuxapk/manifest.tsv
      - name: Full headless compatibility corpus
        id: headless
        run: tools/ci/compat.sh headless
      - name: Full windowed compatibility corpus
        if: ${{ !cancelled() && steps.headless.outcome != 'skipped' }}
        run: tools/ci/compat.sh windowed
      - name: Render compatibility wiki page
        id: wiki
        if: ${{ !cancelled() && steps.headless.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          python3 tools/ci/compat-wiki.py --reports out/ci/reports \
            --output out/ci/reports/Compatibility.md
      - name: Publish compatibility to the wiki
        if: ${{ !cancelled() && steps.wiki.outcome == 'success' }}
        continue-on-error: true # Publishing must never mask the corpus result.
        env:
          GH_TOKEN: ${{ secrets.LINUXAPK_WIKI_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::notice::Wiki publishing skipped: LINUXAPK_WIKI_TOKEN is not set. Compatibility results remain in the artifact.'
            exit 0
          fi
          if ! git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            clone https://github.com/sargunv/linux.apk.wiki.git out/ci/wiki; then
            echo '::warning::Wiki clone failed; check LINUXAPK_WIKI_TOKEN and wiki initialization. See tests/README.md.'
            exit 1
          fi
          cp out/ci/reports/Compatibility.md out/ci/wiki/Compatibility.md
          cd out/ci/wiki
          git add Compatibility.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update nightly compatibility results'
          if ! git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD; then
            echo '::warning::Wiki push failed; compatibility results remain in the artifact. See tools/ci/README.md for the required credential.'
            exit 1
          fi
      - name: Compatibility reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility
          path: |
            out/ci/reports
            out/test/nested
            out/dev/flatpak/**/*.log
            !**/android-data*/**
          retention-days: 14
