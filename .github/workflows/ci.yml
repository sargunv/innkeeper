name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_BUILD_JOBS: 4
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  LINUXAPK_IMAGES: ${{ github.workspace }}/out/ci/images
  FLATPAK_USER_DIR: ${{ github.workspace }}/out/flatpak/user

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60 # Cold Mesa/LLVM builds; warm runs reuse the input cache.
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: mise run check
      - run: mise run build
      - run: mise run test
      - name: Fetch the e2e test apps
        run:
          mise run test:compat -- fetch --only
          io.anuke.mindustry,com.darkempire78.opencalculator,org.wikipedia
      - name: End-to-end tests on an isolated software desktop
        run: tools/ci/desktop.sh mise run test:e2e
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-logs
          path: |
            out/test
            out/ci/desktop
            !out/test/compat/corpus/**
            !out/ci/desktop/android-data*/**
          retention-days: 7

  nightly:
    if:
      github.event_name == 'schedule' || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build the stage and Flatpak
        run: mise run package:flatpak
      - name: Stage manifest
        uses: actions/upload-artifact@v4
        with:
          name: stage-manifest
          path: out/stage/share/linuxapk/manifest.tsv
      - name: Full headless compatibility corpus
        id: headless
        run: tools/ci/desktop.sh tools/ci/compat.sh headless
      - name: Full windowed compatibility corpus
        if: ${{ !cancelled() && steps.headless.outcome != 'skipped' }}
        run: tools/ci/desktop.sh tools/ci/compat.sh windowed
      - name: Compatibility reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility
          path: |
            out/ci/reports
            out/ci/desktop
            !out/ci/desktop/android-data*/**
          retention-days: 14
