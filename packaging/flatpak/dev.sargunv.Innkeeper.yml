# The Innkeeper Flatpak manifest (see README.md here). build.sh fills the two
# out/flatpak directories that it reads. src holds a clean tree from
# `git archive HEAD` with the vendored crates, and prebuilt holds the guest side
# from `mise run build`.
id: dev.sargunv.Innkeeper
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: innkeeper
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=pulseaudio
  # This grants the render node and /dev/udmabuf. --device=all would bind the
  # host's /dev over the sandbox's writable /dev, where the session creates its
  # binder nodes.
  - --device=dri
  # Controllers use evdev. This also exposes the host's keyboards and mice,
  # which matches what other desktop apps can read.
  - --device=input
  # Android uses the host's network directly, like any desktop app.
  - --share=network
  # Android notifications need replace-in-place, progress and inline reply,
  # which the Notification portal lacks.
  - --talk-name=org.freedesktop.Notifications
  # The bridge reads the desktop's assistive-technology switch here. Flatpak's
  # AT-SPI proxy exposes GetAddress but not the org.a11y.Status properties.
  - --talk-name=org.a11y.Bus
  # adb access to a profile is off by default. When it is on, Innkeeper reads
  # the user's adb public key to authorize it in the profile's data
  # (host/profile/src/adb.rs).
  - --filesystem=~/.android/adbkey.pub:ro
  # No battery portal exists on the supported desktop baseline.
  - --system-talk-name=org.freedesktop.UPower
modules:
  # Bionic and static binaries, the guest partitions and the image scripts.
  # Nothing in this module links against the runtime.
  - name: android
    buildsystem: simple
    build-commands:
      - cp -a --no-preserve=ownership . /app/
    sources:
      - type: dir
        path: ../../out/flatpak/prebuilt

  # Everything that runs on the desktop, built against the runtime.
  - name: innkeeper
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/innkeeper/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - mkdir -p cargo
      - printf '[source.crates-io]\nreplace-with =
        "vendored"\n[source.vendored]\ndirectory = "vendor"\n'
        >cargo/config.toml
      - tools/build/host.sh
      - cp -a out/build/host/install/. /app/
      # This module's rows of the stage manifest (tools/build/stage.sh).
      - |
        cd out/build/host/install && find . -type f -printf '%P\n' | sort | while read -r p; do
          printf '%s\thost\t%s\n' "$p" "$(sha256sum <"$p" | cut -d' ' -f1)"
        done >>/app/share/innkeeper/manifest.tsv
    sources:
      - type: dir
        path: ../../out/flatpak/src
      - type: dir
        path: ../../out/flatpak/vendor
        dest: vendor
