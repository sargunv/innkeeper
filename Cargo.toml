[workspace]
members = [
  "host/bridge",
  "host/cli",
  "host/core",
  "host/launcher",
  "host/manager",
  "host/profile",
  "supervisor/broker",
  "supervisor/evdev-proto",
  "tests/compat",
  "tests/bench",
]
# A plain `cargo build` builds only what runs on the desktop: the broker is a
# bionic binary (`mise run build:ndk`) and compat is a test harness.
default-members = [
  "host/bridge",
  "host/cli",
  "host/core",
  "host/launcher",
  "host/manager",
  "host/profile",
]
resolver = "3"
