[package]
name = "innkeeper-broker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Innkeeper broker: serves the session's seccomp user notifications, binder included"

[dependencies]
innkeeper-evdev-proto = { path = "../evdev-proto" }
libc = "0.2"

# Installed as libexec/innkeeper/innkeeper-brk and linked statically against
# musl for both guests. Tests match the name in /proc/<pid>/comm, so it stays
# within TASK_COMM_LEN (15 characters).
[[bin]]
name = "innkeeper-brk"
path = "src/main.rs"

# Tests the real filter and broker against real processes (tests/probes). It
# has its own main because each probe needs a fresh single-threaded process to
# fork from.
[[test]]
name = "probes"
path = "tests/probes/main.rs"
harness = false
