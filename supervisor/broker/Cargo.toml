[package]
name = "linuxapk-broker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux.apk broker: Android's binder driver reimplemented in userspace, served through the session's seccomp user notifications"

[dependencies]
libc = "0.2"

# The dynamic bionic binary pivot-exec forks to serve the session's seccomp
# listener. build:supervisor installs it as /system/bin/linuxapk-broker.
[[bin]]
name = "linuxapk-broker"
path = "src/main.rs"
