[package]
name = "innkeeper-broker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Innkeeper broker: serves the session's seccomp user notifications, binder included"

[dependencies]
libc = "0.2"

# Installed as /system/bin/innkeeper-brk. Tests match the name in
# /proc/<pid>/comm, so it stays within TASK_COMM_LEN (15 characters).
[[bin]]
name = "innkeeper-brk"
path = "src/main.rs"

# C syscall probes exercise the real Rust boundary through this test-only ABI.
[[example]]
name = "supervisor-probes"
path = "../tests/broker.rs"
crate-type = ["staticlib"]
