name = "OpenCalc"
group = "noarch"
version_code = 53
version_name = "3.2.0"
native = "none"
url = "https://f-droid.org/repo/com.darkempire78.opencalculator_53.apk"
sha256 = "2642613868a8a80f0ce963a4863bc153e7281b97b3bbdf36ca92a99dded7134a"
size = 2359134
note = "M1 target; no native code"
script = ["tap:7", "tap:+", "tap:8", "wait:1", "expect:15"]

