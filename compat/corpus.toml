# Compat corpus: pinned F-Droid APKs (see docs/compat-triage.md).
#
# `compat/run.sh fetch` downloads each APK into out/corpus/ and checks its
# SHA-256; the APKs are never committed. To bump an app, copy the new version
# code, URL and SHA-256 from https://f-droid.org/repo/index-v2.json. Prefer
# x86_64 or universal APKs (`native` lists the ABIs the APK ships).
#
# Per app, optional:
#   settle = <seconds>  wait after launch before the first-frame check (default 8)
#   script = [...]      scripted check, run after the first frame:
#                       "tap:<text>"    tap the node whose text or content-desc
#                                       is <text> (uiautomator dump)
#                       "expect:<text>" a node's text or content-desc contains it
#                       "absent:<text>" no node's text or content-desc contains it
#                       "key:<keycode>" "wait:<seconds>"
#   note = "..."        why the app is in the corpus

[[app]]
